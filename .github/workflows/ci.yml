name: Astro-AI Monorepo CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-astrology-engine:
    name: Test Deterministic Astrology Engine (Python 3.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./astrology-engine
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Validation Suite
        run: |
          pytest tests/ -v --tb=short

  test-backend:
    name: Test Core Reasoning API (Spring Boot 3 / Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Integration & Unit Tests
        run: ./mvnw test -B

  test-frontend:
    name: Test & Build Frontend SPA (React 18 / Vite / TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Typecheck TypeScript
        run: npx tsc -b

      - name: Run Vitest Suite
        run: npm test

      - name: Build Production Assets
        run: npm run build

  verify-docker-build:
    name: Verify Multi-Stage Docker Builds
    needs: [test-astrology-engine, test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Sample Environment
        run: cp .env.production.example .env.production

      - name: Build Production Docker Images
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml build
